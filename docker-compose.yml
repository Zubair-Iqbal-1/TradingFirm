services:
  # ── INFRASTRUCTURE ──

  postgres:
    image: postgres:16-alpine
    container_name: tf-postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/supabase/migrations:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradingfirm}
      POSTGRES_USER: ${POSTGRES_USER:-tf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tf_user} -d ${POSTGRES_DB:-tradingfirm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tf-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── BACKEND SERVICES ──

  data-engine:
    build:
      context: ./services/data-engine
      dockerfile: Dockerfile
      target: prod
    container_name: tf-data-engine
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVICE_NAME: data-engine
      SERVICE_PORT: "8001"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tf_user}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tradingfirm}
      REDIS_URL: redis://redis:6379
      DATA_PROVIDER: ${DATA_PROVIDER:-yfinance}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      EDGAR_USER_AGENT: ${EDGAR_USER_AGENT:-}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
    restart: unless-stopped

  # Dev/test twin of data-engine (Part 0.7). Opt-in: not started by a plain
  # `docker compose up -d`; use `docker compose --profile dev up -d data-engine-dev`
  # (naming the service also activates its profile). Runs the Dockerfile's
  # `dev` stage — dev deps baked in, NO application code, so the image is
  # inert without the source mount below (which also supplies tests/, which
  # .dockerignore keeps out of every image). Hard-coded, not from .env:
  #   DATA_PROVIDER=fixture  → nothing on 8011 can reach Finviz/yfinance
  #   FINNHUB_API_KEY=""     → nor Finnhub (Part 2.1)
  #   EDGAR_USER_AGENT=""    → nor SEC EDGAR (Part 2.2)
  #   ALPHAVANTAGE_API_KEY="" → nor Alpha Vantage (Part 2.3)
  #   database tradingfirm_dev, Redis DB 1 → can never write prod's tables or
  #                                          prod's cache keys
  # Create the dev database once with scripts/dev-db.sh; until then the API
  # starts with db_connected=false and every DB path fails closed. No
  # depends_on on purpose: tests mock Postgres/Redis. Joins the default
  # compose network like every other service. A bare `pytest` in here is
  # safe (pytest.ini restricts discovery), but still name the test files.
  data-engine-dev:
    profiles: ["dev"]
    build:
      context: ./services/data-engine
      dockerfile: Dockerfile
      target: dev
    container_name: tf-data-engine-dev
    ports:
      - "8011:8001"
    volumes:
      - ./services/data-engine:/app
      - ./infra/supabase/migrations:/migrations:ro   # read-only, for tests that assert migration text
    environment:
      SERVICE_NAME: data-engine-dev
      SERVICE_PORT: "8001"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tf_user}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/tradingfirm_dev
      REDIS_URL: redis://redis:6379/1
      DATA_PROVIDER: fixture
      FINNHUB_API_KEY: ""     # hard-coded empty: nothing on 8011 can reach Finnhub
      EDGAR_USER_AGENT: ""    # hard-coded empty: nor SEC EDGAR (Part 2.2)
      ALPHAVANTAGE_API_KEY: "" # hard-coded empty: nor Alpha Vantage (Part 2.3)
      DEBUG: "true"
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    restart: "no"

  signal-engine:
    build:
      context: ./services/signal-engine
      dockerfile: Dockerfile
    container_name: tf-signal-engine
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-engine:
        condition: service_started
    environment:
      SERVICE_NAME: signal-engine
      SERVICE_PORT: "8002"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tf_user}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tradingfirm}
      REDIS_URL: redis://redis:6379
      DATA_ENGINE_URL: http://data-engine:8001
    restart: unless-stopped

  risk-shield:
    build:
      context: ./services/risk-shield
      dockerfile: Dockerfile
    container_name: tf-risk-shield
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVICE_NAME: risk-shield
      SERVICE_PORT: "8003"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tf_user}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tradingfirm}
      REDIS_URL: redis://redis:6379
      DATA_PROVIDER: ${DATA_PROVIDER:-yfinance}
      FRED_API_KEY: ${FRED_API_KEY:-}
      SCHEDULER_ENABLED: "true"   # Part 3.4: the regime scheduler runs in prod only
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}         # Part 3.5: market news, header only
      NEWS_POLL_ENABLED: "true"                     # Part 3.5: the news poller runs in prod only
      DATA_ENGINE_URL: http://data-engine:8001      # Part 3.5: POST /news/ingest
      MACRO_BRIEF_ENABLED: "false"                  # Part 3.6a: stays off until ai-agent's /brief/macro (4.6)
      AI_AGENT_URL: http://ai-agent:8004            # Part 3.6b: POST /brief/macro
      WEEKEND_WRITE_TOKEN: ${WEEKEND_WRITE_TOKEN:-}  # Part 3.4c: the situation route's shared secret; empty = route disabled
    restart: unless-stopped

  # Dev/test twin of risk-shield (Part 3.1), the same shape Part 0.7 gave
  # data-engine and for the same reason: the prod image carries no test
  # deps and the host Python is not the pinned set. Opt-in — not started by
  # a plain `docker compose up -d`; use
  # `docker compose --profile dev up -d risk-shield-dev`. Runs the
  # Dockerfile's `dev` stage: dev deps baked in, NO application code, so the
  # image is inert without the source mount below. Hard-coded, not from
  # .env:
  #   FRED_API_KEY=""        → nothing on 8013 can reach FRED (Part 3.2)
  #   FINNHUB_API_KEY=""     → nor Finnhub (Part 3.5)
  #   DATA_ENGINE_URL=data-engine-dev → news can only land in tradingfirm_dev (3.5)
  #   WEEKEND_WRITE_TOKEN="" → the situation route answers 503 here (3.4c)
  #   database tradingfirm_dev, Redis DB 1 → can never write prod's tables
  #                                          or prod's cache keys
  # Create the dev database once with scripts/dev-db.sh (it applies every
  # migration, 005 included). No depends_on on purpose: tests mock
  # Postgres/Redis and open no socket.
  risk-shield-dev:
    profiles: ["dev"]
    build:
      context: ./services/risk-shield
      dockerfile: Dockerfile
      target: dev
    container_name: tf-risk-shield-dev
    ports:
      - "8013:8003"
    volumes:
      - ./services/risk-shield:/app
      - ./infra/supabase/migrations:/migrations:ro   # read-only, for tests that assert migration text
    environment:
      SERVICE_NAME: risk-shield-dev
      SERVICE_PORT: "8003"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tf_user}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/tradingfirm_dev
      REDIS_URL: redis://redis:6379/1
      FRED_API_KEY: ""        # hard-coded empty: nothing on 8013 can reach FRED
      DEBUG: "true"
      SCHEDULER_ENABLED: "false"          # hard-coded: no quotes fixture here, a scheduler would download live (3.4)
      HEALTH_CHANNEL: tf:risk:dev:health  # pub/sub ignores the Redis DB index: never prod's channel (3.4)
      FINNHUB_API_KEY: ""                 # hard-coded empty: nothing on 8013 can reach Finnhub (3.5)
      NEWS_POLL_ENABLED: "false"          # hard-coded: the twin never polls (3.5)
      DATA_ENGINE_URL: http://data-engine-dev:8001  # hard-coded: never prod's data-engine or database (3.5)
      MACRO_BRIEF_ENABLED: "false"                  # hard-coded: the twin never generates a brief (3.6a)
      AI_AGENT_URL: http://ai-agent.invalid:8004    # hard-coded: .invalid never resolves, no LLM from the twin (3.6a)
      WEEKEND_WRITE_TOKEN: ""                       # hard-coded empty: the twin's situation route is disabled (3.4c)
    command: uvicorn main:app --host 0.0.0.0 --port 8003 --workers 1 --reload
    restart: "no"

  ai-agent:
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile
    container_name: tf-ai-agent
    ports:
      # Loopback only (Part 4.2, spec decision 17): POST /classify/headlines
      # spends money and GET /usage reports spend, and a real OPENROUTER_API_KEY
      # sits behind them. Other services reach this one by compose DNS
      # (http://ai-agent:8004), which does not use the published port, so
      # nothing in the stack notices. The host can still curl it.
      - "127.0.0.1:8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVICE_NAME: ai-agent
      SERVICE_PORT: "8004"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tf_user}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tradingfirm}
      REDIS_URL: redis://redis:6379
      # One provider in code (decisions.md 2026-09-20): an OpenAI-compatible
      # client pointed at OpenRouter. LLM_PROVIDER / ANTHROPIC_API_KEY /
      # GOOGLE_AI_API_KEY were dropped here in Part 4.2 — Settings never read
      # them. The key line lives in .env and is set by hand; empty is safe,
      # the provider refuses before it builds a client.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-5}
      LLM_MODEL_CLASSIFIER: ${LLM_MODEL_CLASSIFIER:-anthropic/claude-sonnet-5}
      LLM_DAILY_CALL_CAP: ${LLM_DAILY_CALL_CAP:-100}
      # The classifier's smaller cap, so a batch loop cannot eat the
      # analyst's budget: ~14 calls a day expected, 40 is ~3x headroom, and
      # 60 of the global 100 stay free for verdicts and the macro brief.
      LLM_CLASSIFIER_DAILY_CALL_CAP: ${LLM_CLASSIFIER_DAILY_CALL_CAP:-40}
      DATA_ENGINE_URL: http://data-engine:8001
      # Part 4.4: /analyze reads the regime (and the macro brief, once 4.6
      # writes one) from risk-shield. Fail-open on its side.
      RISK_SHIELD_URL: http://risk-shield:8003
      # cache_control on the verdict's system block. Off until the live check
      # shows the prefix clears Sonnet 5's 1,024-token minimum (spec 4.4 d.12).
      LLM_VERDICT_CACHE: ${LLM_VERDICT_CACHE:-false}
      # Empty = OpenRouter's normal routing. Set in .env (e.g. anthropic) to
      # pin every request to the listed host(s) with no fallback: a prompt
      # cache is per host. Not carried by ai-agent-dev.
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-}
    restart: unless-stopped

  # Dev/test twin of ai-agent (Part 4.1), the same shape Part 3.1 gave
  # risk-shield and Part 0.7 gave data-engine, for the same reason: the prod
  # image carries no test deps and the host Python is not the pinned set.
  # Opt-in — not started by a plain `docker compose up -d`; use
  # `docker compose --profile dev up -d ai-agent-dev`. Runs the Dockerfile's
  # `dev` stage: dev deps baked in, NO application code, so the image is
  # inert without the source mount below. Hard-coded, not from .env:
  #   OPENROUTER_API_KEY=""   → nothing on 8014 can reach an LLM
  #   LLM_DAILY_CALL_CAP="0"  → second lock: even a leaked key refuses
  #   LLM_BASE_URL=.invalid   → third lock: RFC 6761, it never resolves
  #   LLM_CLASSIFIER_DAILY_CALL_CAP="0" → fourth lock (4.2): the classifier
  #                                       refuses before the global cap does
  #   database tradingfirm_dev, Redis DB 1 → can never write prod's tables
  #                                          or prod's cache keys
  #   DATA_ENGINE_URL=data-engine-dev → the classifier's write-back can never
  #                                     reach prod's news_items (4.2)
  #   RISK_SHIELD_URL=risk-shield-dev → /analyze never reads prod's regime
  #                                     rows (4.4); test_twin_never_calls_prod_risk_shield
  # test_twin_never_calls_openrouter asserts the five LLM locks and
  # test_twin_never_writes_prod_data_engine the last one. Never drop them.
  # No depends_on on purpose: tests mock Postgres/Redis and open no socket.
  ai-agent-dev:
    profiles: ["dev"]
    build:
      context: ./services/ai-agent
      dockerfile: Dockerfile
      target: dev
    container_name: tf-ai-agent-dev
    ports:
      - "8014:8004"
    volumes:
      - ./services/ai-agent:/app
      - ./infra/supabase/migrations:/migrations:ro   # read-only, for tests that assert migration text
    environment:
      SERVICE_NAME: ai-agent-dev
      SERVICE_PORT: "8004"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tf_user}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/tradingfirm_dev
      REDIS_URL: redis://redis:6379/1
      OPENROUTER_API_KEY: ""                        # hard-coded empty: no LLM from the twin (4.1)
      LLM_DAILY_CALL_CAP: "0"                       # hard-coded 0: every call refused, key or not (4.1)
      LLM_BASE_URL: http://openrouter.invalid/api/v1  # hard-coded: .invalid never resolves (4.1)
      LLM_CLASSIFIER_DAILY_CALL_CAP: "0"            # hard-coded 0: the classifier refuses too (4.2)
      DATA_ENGINE_URL: http://data-engine-dev:8001  # hard-coded: never prod's news_items (4.2)
      RISK_SHIELD_URL: http://risk-shield-dev:8003  # hard-coded: never prod's risk-shield (4.4)
      LLM_VERDICT_CACHE: "false"
    command: uvicorn main:app --host 0.0.0.0 --port 8004 --reload
    restart: "no"

  # ── FRONTEND ──

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tf-web
    ports:
      - "3000:3000"
    depends_on:
      data-engine:
        condition: service_healthy
      signal-engine:
        condition: service_started
      risk-shield:
        condition: service_started
      ai-agent:
        condition: service_started
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      DATA_ENGINE_URL: http://data-engine:8001
      SIGNAL_ENGINE_URL: http://signal-engine:8002
      RISK_SHIELD_URL: http://risk-shield:8003
      AI_AGENT_URL: http://ai-agent:8004
    restart: unless-stopped

volumes:
  pgdata:
    driver: local
